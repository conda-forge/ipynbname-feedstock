schema_version: 1

context:
  name: ipynbname
  version: "2025.8.0.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: dcc8367c64c4a9f0baa6acea3e509fd6696bf5d81c9abceb386e2ad6efcac935

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - ipykernel

tests:
  - python:
      imports:
        - ipynbname
      pip_check: false
      python_version:
        - ${{ python_min }}.*
        - "*"      

about:
  license: MIT
  license_file: LICENSE.txt
  summary: Simple utility that retrieves current Jupyter notebook filename or path, when run from Jupyter notebook
  homepage: https://github.com/msm1089/ipynbname
  repository: https://github.com/msm1089/ipynbname

extra:
  recipe-maintainers:
    - DamienIrving
    - msm1089
